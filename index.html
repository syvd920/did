<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공인중개사 광고 제작기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:#111}
.wrap{max-width:1320px;margin:0 auto;padding:20px;display:grid;grid-template-columns:430px 1fr;gap:20px}.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 6px}.desc{font-size:13px;color:#6b7280;line-height:1.5}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d9dde3;border-radius:9px;background:#fff}textarea{min-height:72px;resize:vertical}
.cellform{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:14px;background:#fafafa}.celltitle{font-weight:900;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stylegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
button{border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer}.primary{background:#111;color:#fff;width:100%;margin-top:15px}
.preview{display:flex;justify-content:center;align-items:flex-start;overflow:auto}canvas{max-width:100%;height:auto;background:#ddd;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
@media(max-width:950px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>매물 광고 제작기</h1>
<div class="desc">분할 수만큼 각각 다른 매물 정보를 입력할 수 있습니다.</div>
<label>1. 방향 선택</label>
<select id="orientation">
  <option value="">선택하세요</option>
  <option value="landscape">가로버전</option>
  <option value="portrait">세로버전</option>
</select>

<label>2. 분할 선택</label>
<select id="split" disabled>
  <option value="">선택하세요</option>
  <option value="1">1분할</option>
  <option value="2">2분할</option>
  <option value="3">3분할</option>
  <option value="4">4분할</option>
  <option value="6">6분할</option>
</select>

<label>3. 템플릿 선택</label>
<select id="tpl" disabled>
  <option value="">방향과 분할을 먼저 선택하세요</option>
</select>
<div id="forms"></div>
<button class="primary" id="download">PNG 다운로드</button>
</section>
<section class="panel preview"><canvas id="canvas" width="1400" height="1080"></canvas></section>
</div>

<script src="templates.js"></script>
<script src="published-templates.js"></script>
<script>
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');
let templates=(window.PUBLISHED_TEMPLATES&&window.PUBLISHED_TEMPLATES.length)?window.PUBLISHED_TEMPLATES:DEFAULT_TEMPLATES,bgImg=null,cellImages=[];
const fonts=['Arial','Noto Sans KR','Pretendard','serif','sans-serif'];
function cur(){
  const t=templates.find(t=>t.id===$('tpl').value)||templates.find(t=>Number(t.panelSplit||1)===Number($('split').value||0))||templates[0];
  if(!t.enabledFields)t.enabledFields={dealType:true,propertyName:true,price:true,pyeong:true,roomsBaths:true,description:true};
  return t;
}
function refreshTemplateOptions(){
  const orientation=$('orientation').value;
  const split=Number($('split').value||0);
  const select=$('tpl');
  select.innerHTML='';

  if(!orientation || !split){
    const o=document.createElement('option');
    o.value='';
    o.textContent='방향과 분할을 먼저 선택하세요';
    select.appendChild(o);
    select.disabled=true;
    return;
  }

  const matched=templates.filter(t=>{
    const orientationOk=!t.availableOrientations || t.availableOrientations[orientation]!==false;
    return orientationOk && Number(t.panelSplit||1)===split;
  });

  if(!matched.length){
    const o=document.createElement('option');
    o.value='';
    o.textContent='해당 조건의 템플릿이 없습니다';
    select.appendChild(o);
    select.disabled=true;
    return;
  }

  matched.forEach(t=>{
    const o=document.createElement('option');
    o.value=t.id;
    o.textContent=t.name;
    select.appendChild(o);
  });
  select.disabled=false;
}
function makeCells(split,w,h,o){
  let cells=[];
  if(split===1)cells=[{x:0,y:0,w,h}];

  if(split===2){
    cells=o==='landscape'
      ? [{x:0,y:0,w:w/2,h},{x:w/2,y:0,w:w/2,h}]
      : [{x:0,y:0,w,h:h/2},{x:0,y:h/2,w,h:h/2}];
  }

  if(split===3){
    const topH=h*0.60;
    const bottomH=h-topH;
    cells=[
      {x:0,y:0,w:w,h:topH},
      {x:0,y:topH,w:w/2,h:bottomH},
      {x:w/2,y:topH,w:w/2,h:bottomH}
    ];
  }

  if(split===4){
    cells=[0,1,2,3].map(i=>({
      x:(i%2)*w/2,
      y:Math.floor(i/2)*h/2,
      w:w/2,
      h:h/2
    }));
  }

  if(split===6){
    cells=o==='landscape'
      ? [0,1,2,3,4,5].map(i=>({x:(i%3)*w/3,y:Math.floor(i/3)*h/2,w:w/3,h:h/2}))
      : [0,1,2,3,4,5].map(i=>({x:(i%2)*w/2,y:Math.floor(i/2)*h/3,w:w/2,h:h/3}));
  }
  return cells;
}
function baseFields(cell){
  const pad=Math.max(16,cell.w*.04);
  return [
    {key:'dealType',x:cell.x+pad,y:cell.y+pad,fontSize:Math.max(18,cell.w*.045),color:'#fff',weight:800,fontFamily:'Arial'},
    {key:'propertyName',x:cell.x+pad,y:cell.y+pad+48,fontSize:Math.max(26,cell.w*.08),color:'#fff',weight:900,fontFamily:'Arial'},
    {key:'price',x:cell.x+pad,y:cell.y+pad+105,fontSize:Math.max(22,cell.w*.055),color:'#ffd54a',weight:900,fontFamily:'Arial'},
    {key:'pyeong',x:cell.x+pad,y:cell.y+cell.h*.58,fontSize:Math.max(18,cell.w*.043),color:'#fff',weight:700,fontFamily:'Arial'},
    {key:'roomsBaths',x:cell.x+cell.w*.42,y:cell.y+cell.h*.58,fontSize:Math.max(18,cell.w*.043),color:'#fff',weight:700,fontFamily:'Arial'},
    {key:'description',x:cell.x+pad,y:cell.y+cell.h*.70,fontSize:Math.max(17,cell.w*.038),color:'#fff',weight:700,fontFamily:'Arial',maxWidth:cell.w-pad*2,maxLines:2,lineHeight:Math.max(24,cell.w*.05)}
  ];
}
function styleControls(key,idx,base){
  const wrap=document.createElement('div');wrap.className='stylegrid';
  const c=document.createElement('input');c.type='color';c.value='#000000';c.id=`${key}Color${idx}`;
  const s=document.createElement('input');s.type='number';s.min=10;s.max=160;s.value=base.fontSize||24;s.id=`${key}Size${idx}`;
  c.addEventListener('input',render);s.addEventListener('input',render);
  wrap.append(c,s);
  return wrap;
}
function setupForms(){
  if(!$('orientation').value || !$('split').value || !$('tpl').value){$('forms').innerHTML='';return;}
  const t=cur(),o=$('orientation').value,d=t.orientations[o],ld=t.layoutData&&t.layoutData[o],cells=makeCells(t.panelSplit||1,d.width,d.height,o);
  const box=$('forms');box.innerHTML='';cellImages=[];
  cells.forEach((cell,idx)=>{
    const flds=(ld&&ld.cellData&&ld.cellData[idx]&&ld.cellData[idx].fields)||baseFields(cell);
    const f=document.createElement('div');f.className='cellform';f.innerHTML=`<div class="celltitle">${idx+1}번 매물</div>`;
    if(t.hasPhoto){
      const lab=document.createElement('label');lab.textContent='사진';const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{cellImages[idx]=im;render()};im.src=ev.target.result};r.readAsDataURL(file)});f.append(lab,inp);
    }
    const deal=document.createElement('select');deal.id=`dealType${idx}`;['매매','월세','전세'].forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=v;deal.appendChild(op)});
    const name=document.createElement('input');name.id=`propertyName${idx}`;name.value='매물명';
    const price=document.createElement('input');price.id=`price${idx}`;price.value='매매 9억 8,000만원';
    const row=document.createElement('div');row.className='row';
    const py=document.createElement('input');py.type='number';py.id=`pyeong${idx}`;py.value=25;
    const rb=document.createElement('div');rb.className='row';
    const room=document.createElement('input');room.type='number';room.id=`room${idx}`;room.value=2;
    const bath=document.createElement('input');bath.type='number';bath.id=`bath${idx}`;bath.value=1;rb.append(room,bath);row.append(py,rb);
    const desc=document.createElement('textarea');desc.id=`description${idx}`;desc.value='매물 설명을 입력하세요.';
    [deal,name,price,py,room,bath,desc].forEach(el=>{el.addEventListener('input',render);el.addEventListener('change',render)});
    if(t.enabledFields.dealType!==false){
      const l=document.createElement('label');l.textContent='매물 구분';
      f.append(l,deal,styleControls('dealType',idx,flds.find(x=>x.key==='dealType')||{}));
    }
    if(t.enabledFields.propertyName!==false){
      const l=document.createElement('label');l.textContent='매물명';
      f.append(l,name,styleControls('propertyName',idx,flds.find(x=>x.key==='propertyName')||{}));
    }
    if(t.enabledFields.price!==false){
      const l=document.createElement('label');l.textContent='매물금액';
      f.append(l,price,styleControls('price',idx,flds.find(x=>x.key==='price')||{}));
    }
    if(t.enabledFields.pyeong!==false){
      const l=document.createElement('label');l.textContent='평';
      f.append(l,py,styleControls('pyeong',idx,flds.find(x=>x.key==='pyeong')||{}));
    }
    if(t.enabledFields.roomsBaths!==false){
      const l=document.createElement('label');l.textContent='방 / 욕실';
      f.append(l,rb,styleControls('roomsBaths',idx,flds.find(x=>x.key==='roomsBaths')||{}));
    }
    if(t.enabledFields.description!==false){
      const l=document.createElement('label');l.textContent='매물설명';
      f.append(l,desc,styleControls('description',idx,flds.find(x=>x.key==='description')||{}));
    }
    box.appendChild(f);
  });
}
function contain(im,b){
  const sc=Math.min(b.w/im.width,b.h/im.height),w=im.width*sc,h=im.height*sc,x=b.x+(b.w-w)/2,y=b.y+(b.h-h)/2;ctx.drawImage(im,x,y,w,h);
}
function measureTextWidth(text,font,size,weight){
  ctx.font=`${weight||700} ${size}px "${font}"`;
  return ctx.measureText(text).width;
}
function centeredDrawX(text,cfg,font,newSize,weight){
  const baseSize=cfg.fontSize||newSize;
  const baseFont=cfg.fontFamily||font;
  const baseW=measureTextWidth(text,baseFont,baseSize,weight);
  const newW=measureTextWidth(text,font,newSize,weight);
  if((cfg.align||'left')==='center') return cfg.x;
  if((cfg.align||'left')==='right') return cfg.x;
  return cfg.x+(baseW-newW)/2;
}
function centeredDrawY(cfg,newSize){
  const baseSize=cfg.fontSize||newSize;
  return cfg.y+(baseSize-newSize)/2;
}
function drawWrapped(text,cfg,idx){
  const size=Number(document.getElementById(`descriptionSize${idx}`).value),color=document.getElementById(`descriptionColor${idx}`).value;
  ctx.font=`${cfg.weight||700} ${size}px "${cfg.fontFamily||'Arial'}"`;ctx.fillStyle=color;ctx.textBaseline='top';ctx.textAlign=cfg.align||'left';
  ctx.lineJoin='round';ctx.strokeStyle=cfg.strokeColor||'#000000';ctx.lineWidth=cfg.strokeWidth||2;
  const mw=cfg.maxWidth||400,lh=cfg.lineHeight||size*1.25;let line='',lines=[];
  for(const ch of [...text]){const test=line+ch;if(ctx.measureText(test).width>mw&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);
  lines.slice(0,2).forEach((ln,i)=>{if(cfg.strokeEnabled)ctx.strokeText(ln,cfg.x,cfg.y+i*lh);ctx.fillText(ln,cfg.x,cfg.y+i*lh)});
}
function drawSimple(text,cfg,key,idx){
  const size=Number(document.getElementById(`${key}Size${idx}`).value),color=document.getElementById(`${key}Color${idx}`).value;
  ctx.font=`${cfg.weight||700} ${size}px "${cfg.fontFamily||'Arial'}"`;ctx.fillStyle=color;ctx.textBaseline='top';ctx.textAlign=cfg.align||'left';
  ctx.lineJoin='round';ctx.strokeStyle=cfg.strokeColor||'#000000';ctx.lineWidth=cfg.strokeWidth||2;
  if(cfg.strokeEnabled)ctx.strokeText(text,cfg.x,cfg.y);
  ctx.fillText(text,cfg.x,cfg.y);
}
function loadBg(){
  if(!$('orientation').value || !$('split').value || !$('tpl').value){bgImg=null;render();return;}
  const t=cur(),o=$('orientation').value,src=t.backgrounds&&t.backgrounds[o];
  if(!src){bgImg=null;render();return}
  const im=new Image();im.onload=()=>{bgImg=im;render()};im.src=src;
}
function render(){
  if(!$('orientation').value || !$('split').value || !$('tpl').value){ctx.clearRect(0,0,$('canvas').width,$('canvas').height);return;}
  const t=cur(),o=$('orientation').value,d=t.orientations[o],ld=t.layoutData&&t.layoutData[o],cells=makeCells(t.panelSplit||1,d.width,d.height,o);
  $('canvas').width=d.width;$('canvas').height=d.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,d.width,d.height);
  cells.forEach((cell,idx)=>{
    if(t.hasPhoto&&cellImages[idx]){ctx.save();ctx.beginPath();ctx.rect(cell.x,cell.y,cell.w,cell.h);ctx.clip();contain(cellImages[idx],cell);ctx.restore()}
  });
  if(ld&&ld.shapes)ld.shapes.forEach(s=>{ctx.save();ctx.globalAlpha=s.opacity??1;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(s.x,s.y,s.w,s.h,s.radius||0);else ctx.rect(s.x,s.y,s.w,s.h);ctx.fillStyle=s.color||'#ffffff';ctx.fill();if((s.borderWidth||0)>0){ctx.lineWidth=s.borderWidth;ctx.strokeStyle=s.borderColor||'#000000';ctx.stroke()}ctx.restore()});
  if(bgImg)ctx.drawImage(bgImg,0,0,d.width,d.height);
  cells.forEach((cell,idx)=>{
    const flds=(ld&&ld.cellData&&ld.cellData[idx]&&ld.cellData[idx].fields)||baseFields(cell),fm=Object.fromEntries(flds.map(f=>[f.key,f]));
    if(t.enabledFields.dealType!==false) drawSimple(document.getElementById(`dealType${idx}`).value,fm.dealType,'dealType',idx);
    if(t.enabledFields.propertyName!==false) drawSimple(document.getElementById(`propertyName${idx}`).value,fm.propertyName,'propertyName',idx);
    if(t.enabledFields.price!==false) drawSimple(document.getElementById(`price${idx}`).value,fm.price,'price',idx);
    if(t.enabledFields.pyeong!==false) drawSimple((document.getElementById(`pyeong${idx}`).value||'')+'평',fm.pyeong,'pyeong',idx);
    if(t.enabledFields.roomsBaths!==false) drawSimple(`방 ${document.getElementById(`room${idx}`).value||0} / 욕실 ${document.getElementById(`bath${idx}`).value||0}`,fm.roomsBaths,'roomsBaths',idx);
    if(t.enabledFields.description!==false) drawWrapped(document.getElementById(`description${idx}`).value,fm.description,idx);
  });
}
$('orientation').addEventListener('change',()=>{
  $('split').disabled=!$('orientation').value;
  $('split').value='';
  refreshTemplateOptions();
  $('forms').innerHTML='';
  bgImg=null;
  render();
});
$('split').addEventListener('change',()=>{
  refreshTemplateOptions();
  if(!$('tpl').disabled && $('tpl').options.length){
    $('tpl').selectedIndex=0;
    setupForms();
    loadBg();
  }else{
    $('forms').innerHTML='';
    bgImg=null;
    render();
  }
});
$('tpl').addEventListener('change',()=>{setupForms();loadBg();});
$('download').addEventListener('click',()=>{render();const a=document.createElement('a');a.download='realestate_ad.png';a.href=$('canvas').toDataURL('image/png');a.click()});
refreshTemplateOptions();render();
</script>
</body></html>
