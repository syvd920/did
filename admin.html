<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>템플릿 관리자 안내</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:#f4f6f8;margin:0;color:#111}
.wrap{max-width:900px;margin:40px auto;padding:24px}
.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
code{background:#f0f2f4;padding:3px 6px;border-radius:6px}
h1{margin-top:0}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>템플릿 관리자</h1>
<p>중개사 화면에서는 배치·폰트·크기를 수정할 수 없습니다.</p>
<p>관리자는 <code>templates.js</code>에서 5개 템플릿의 가로/세로 좌표, 폰트 크기, 기본 강조색을 수정합니다.</p>
<p>현재 버전은 회원 기능 없이 GitHub Pages에 바로 배포할 수 있도록 구성했습니다.</p>
<p><strong>중개사가 변경 가능한 항목:</strong> 사진, 메인카피, 서브카피, 가격/조건, 상호, 연락처, 강조색.</p>
</div></div>
</body>
</html>
