<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>광고 템플릿 관리자</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:#111}
.wrap{max-width:1500px;margin:0 auto;padding:20px;display:grid;grid-template-columns:390px 1fr;gap:20px}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 6px}.desc{font-size:13px;color:#6b7280;line-height:1.5}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}
input,select{width:100%;padding:10px 11px;border:1px solid #d9dde3;border-radius:9px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{border:0;border-radius:10px;padding:11px 12px;font-weight:800;cursor:pointer}
.primary{background:#111;color:#fff}.secondary{background:#edf0f3}.danger{background:#fee2e2;color:#991b1b}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.canvasbox{display:flex;justify-content:center;align-items:flex-start;overflow:auto;min-height:760px}
#editor{position:relative;background:#eceff3;box-shadow:0 8px 30px rgba(0,0,0,.12);transform-origin:top center;background-size:100% 100%;background-repeat:no-repeat}
.el{position:absolute;border:1px dashed transparent;cursor:move;user-select:none;padding:2px 4px;white-space:pre-wrap}
.el.selected{border-color:#2563eb;background:rgba(37,99,235,.08)}
.photo{position:absolute;border:2px dashed #7c3aed;background:rgba(124,58,237,.10);display:flex;align-items:center;justify-content:center;color:#6d28d9;font-weight:800;cursor:move;resize:both;overflow:auto}
.section{border-top:1px solid #eceff3;margin-top:16px;padding-top:14px}
.small{font-size:12px;color:#777;line-height:1.5}
.thumb{width:100%;max-height:120px;object-fit:contain;background:#f3f4f6;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
  <h1>템플릿 관리자</h1>
  <div class="desc">배경 디자인과 레이아웃은 관리자가 만들고, 중개사는 각 글씨의 폰트·색상·크기를 필요에 따라 바꿀 수 있습니다.</div>

  <label>템플릿</label>
  <select id="tplSelect"></select>
  <div class="actions">
    <button class="secondary" id="newTpl">새 템플릿</button>
    <button class="danger" id="deleteTpl">삭제</button>
  </div>

  <div class="section">
    <label>템플릿 이름</label>
    <input id="tplName">

    <label>방향</label>
    <select id="orientation">
      <option value="landscape">가로버전</option>
      <option value="portrait">세로버전</option>
    </select>

    <label>배경 디자인 이미지</label>
    <input type="file" id="bgUpload" accept="image/*">
    <div class="small">가로버전과 세로버전 배경을 각각 업로드합니다.</div>
    <img id="bgThumb" class="thumb" alt="배경 미리보기">

    <div class="row">
      <div>
        <label>사진 사용</label>
        <select id="hasPhoto">
          <option value="true">사진 있음</option>
          <option value="false">사진 없음</option>
        </select>
      </div>
      <div>
        <label>사진 분할</label>
        <select id="photoSplit">
          <option value="1">1분할</option><option value="2">2분할</option><option value="3">3분할</option>
          <option value="4">4분할</option><option value="6">6분할</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section">
    <strong>선택 글씨 기본값</strong>
    <div class="small">중개사 화면에 처음 보이는 기본 폰트/색상/크기입니다.</div>
    <label>글씨 종류</label>
    <select id="fontFamily">
      <option value="Arial">Arial</option>
      <option value="Noto Sans KR">Noto Sans KR</option>
      <option value="Pretendard">Pretendard</option>
      <option value="serif">Serif</option>
      <option value="sans-serif">Sans Serif</option>
    </select>
    <label>글자 크기</label>
    <input type="number" id="fontSize" min="12" max="160">
    <label>글자 색상</label>
    <input type="color" id="fontColor">
    <label>굵기</label>
    <select id="fontWeight">
      <option value="400">보통</option><option value="700">굵게</option>
      <option value="800">매우 굵게</option><option value="900">최대 굵게</option>
    </select>
    <label>정렬</label>
    <select id="align">
      <option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option>
    </select>
  </div>

  <div class="actions">
    <button class="primary" id="saveLocal">이 브라우저에 저장</button>
    <button class="secondary" id="exportBtn">템플릿 파일 내보내기</button>
  </div>
</section>

<section class="panel">
  <div class="canvasbox"><div id="editor"></div></div>
</section>
</div>

<script src="templates.js"></script>
<script>
const $=id=>document.getElementById(id);
let templates=JSON.parse(localStorage.getItem('adTemplatesV5')||'null')||JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
let current=null, selectedField=null, dragging=null, offsetX=0, offsetY=0;

function refreshSelect(){
  $('tplSelect').innerHTML='';
  templates.forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.name;$('tplSelect').appendChild(o)});
  if(current) $('tplSelect').value=current.id;
}
function ori(){return $('orientation').value}
function ensure(t,o){
  if(!t.backgrounds) t.backgrounds={landscape:'',portrait:''};
  if(!t.layoutData) t.layoutData={};
  if(!t.layoutData[o]) t.layoutData[o]={photoBoxes:null,fields:{}};
}
function dims(){return current.orientations[ori()]}
function genBoxes(split,w,h){
  const gap=14,pad=30,top=30,uw=w-pad*2,uh=Math.floor(h*.58)-top;let a=[];
  if(split===1)a=[{x:pad,y:top,w:uw,h:uh}];
  if(split===2)a=[{x:pad,y:top,w:(uw-gap)/2,h:uh},{x:pad+(uw+gap)/2,y:top,w:(uw-gap)/2,h:uh}];
  if(split===3)a=[0,1,2].map(i=>({x:pad+i*((uw-2*gap)/3+gap),y:top,w:(uw-2*gap)/3,h:uh}));
  if(split===4)a=[0,1,2,3].map(i=>({x:pad+(i%2)*((uw-gap)/2+gap),y:top+Math.floor(i/2)*((uh-gap)/2+gap),w:(uw-gap)/2,h:(uh-gap)/2}));
  if(split===6)a=[0,1,2,3,4,5].map(i=>({x:pad+(i%3)*((uw-2*gap)/3+gap),y:top+Math.floor(i/3)*((uh-gap)/2+gap),w:(uw-2*gap)/3,h:(uh-gap)/2}));
  return a;
}
function applyRect(d,b){d.style.left=b.x+'px';d.style.top=b.y+'px';d.style.width=b.w+'px';d.style.height=b.h+'px'}
function bindDrag(el,data,isPhoto=false){
  el.addEventListener('pointerdown',e=>{
    if(e.target!==el)return;
    dragging={el,data,isPhoto};const r=el.getBoundingClientRect();offsetX=e.clientX-r.left;offsetY=e.clientY-r.top;el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging||dragging.el!==el)return;
    const er=$('editor').getBoundingClientRect(),sx=$('editor').offsetWidth/er.width,sy=$('editor').offsetHeight/er.height;
    data.x=Math.max(0,(e.clientX-er.left)*sx-offsetX*sx);data.y=Math.max(0,(e.clientY-er.top)*sy-offsetY*sy);
    el.style.left=data.x+'px';el.style.top=data.y+'px';
  });
  el.addEventListener('pointerup',()=>{if(dragging&&dragging.el===el&&isPhoto){data.w=el.offsetWidth;data.h=el.offsetHeight}dragging=null});
}
function selectField(data,el){
  selectedField=data;document.querySelectorAll('.el').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');
  $('fontFamily').value=data.fontFamily||'Arial';$('fontSize').value=data.fontSize;$('fontColor').value=data.color;$('fontWeight').value=String(data.weight);$('align').value=data.align||'left';
}
function render(){
  if(!current)return;ensure(current,ori());const d=dims(),scale=Math.min(1,920/d.width,720/d.height),ed=$('editor');
  ed.style.width=d.width+'px';ed.style.height=d.height+'px';ed.style.transform=`scale(${scale})`;ed.style.backgroundImage=current.backgrounds[ori()]?`url("${current.backgrounds[ori()]}")`:'none';ed.innerHTML='';
  const ld=current.layoutData[ori()];
  if(current.hasPhoto){
    if(!ld.photoBoxes||ld.photoBoxes.length!==Number(current.photoSplit))ld.photoBoxes=genBoxes(Number(current.photoSplit),d.width,d.height);
    ld.photoBoxes.forEach((b,i)=>{const el=document.createElement('div');el.className='photo';el.textContent=`사진 ${i+1}`;applyRect(el,b);ed.appendChild(el);bindDrag(el,b,true)});
  }
  current.fields.forEach(f=>{
    const data={...f,...(ld.fields[f.key]||{})};ld.fields[f.key]=data;
    const el=document.createElement('div');el.className='el';el.textContent=f.label;el.style.left=data.x+'px';el.style.top=data.y+'px';el.style.fontSize=data.fontSize+'px';
    el.style.fontWeight=data.weight;el.style.color=data.color;el.style.textAlign=data.align||'left';el.style.fontFamily=data.fontFamily||'Arial';
    if(data.maxWidth)el.style.width=data.maxWidth+'px';
    ed.appendChild(el);el.addEventListener('click',e=>{e.stopPropagation();selectField(data,el)});bindDrag(el,data,false);
  });
  $('bgThumb').src=current.backgrounds[ori()]||'';
}
function load(){
  current=templates.find(t=>t.id===$('tplSelect').value)||templates[0];ensure(current,ori());
  $('tplName').value=current.name;$('hasPhoto').value=String(current.hasPhoto);$('photoSplit').value=String(current.photoSplit||1);$('photoSplit').disabled=!current.hasPhoto;render();
}
$('tplSelect').addEventListener('change',load);$('orientation').addEventListener('change',load);
$('tplName').addEventListener('input',()=>{current.name=$('tplName').value;refreshSelect()});
$('hasPhoto').addEventListener('change',()=>{current.hasPhoto=$('hasPhoto').value==='true';$('photoSplit').disabled=!current.hasPhoto;render()});
$('photoSplit').addEventListener('change',()=>{current.photoSplit=Number($('photoSplit').value);ensure(current,ori());current.layoutData[ori()].photoBoxes=null;render()});
$('bgUpload').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{ensure(current,ori());current.backgrounds[ori()]=ev.target.result;render()};r.readAsDataURL(f)});
$('fontFamily').addEventListener('change',()=>{if(selectedField){selectedField.fontFamily=$('fontFamily').value;render()}});
$('fontSize').addEventListener('input',()=>{if(selectedField){selectedField.fontSize=Number($('fontSize').value);render()}});
$('fontColor').addEventListener('input',()=>{if(selectedField){selectedField.color=$('fontColor').value;render()}});
$('fontWeight').addEventListener('change',()=>{if(selectedField){selectedField.weight=Number($('fontWeight').value);render()}});
$('align').addEventListener('change',()=>{if(selectedField){selectedField.align=$('align').value;render()}});
$('newTpl').addEventListener('click',()=>{
  current={id:'tpl'+Date.now(),name:'새 템플릿',hasPhoto:true,photoSplit:1,backgrounds:{landscape:'',portrait:''},
  orientations:{landscape:{width:1400,height:1080},portrait:{width:1080,height:1300}},
  fields:[
    {key:'dealType',label:'매물 구분',x:70,y:650,fontSize:34,color:'#ffffff',weight:800,align:'left',fontFamily:'Arial'},
    {key:'propertyName',label:'매물명',x:70,y:710,fontSize:70,color:'#ffffff',weight:900,align:'left',fontFamily:'Arial'},
    {key:'pyeong',label:'평',x:70,y:855,fontSize:34,color:'#ffffff',weight:700,align:'left',fontFamily:'Arial'},
    {key:'roomsBaths',label:'방·욕실',x:250,y:855,fontSize:34,color:'#ffffff',weight:700,align:'left',fontFamily:'Arial'},
    {key:'description',label:'매물설명',x:70,y:920,fontSize:31,color:'#ffffff',weight:700,align:'left',fontFamily:'Arial',maxWidth:1120,maxLines:2,lineHeight:40}
  ]};templates.push(current);refreshSelect();load()
});
$('deleteTpl').addEventListener('click',()=>{if(templates.length<=1)return alert('최소 1개 템플릿은 필요합니다.');templates=templates.filter(t=>t.id!==current.id);current=templates[0];refreshSelect();load()});
$('saveLocal').addEventListener('click',()=>{localStorage.setItem('adTemplatesV5',JSON.stringify(templates));alert('저장했습니다.')});
$('exportBtn').addEventListener('click',()=>{const js='window.PUBLISHED_TEMPLATES = '+JSON.stringify(templates,null,2)+';';const blob=new Blob([js],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='published-templates.js';a.click();URL.revokeObjectURL(a.href)});
refreshSelect();current=templates[0];load();
</script>
</body></html>
